name: Vercel Production Deployment & Smoke Tests

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ci-gate:
    name: Wait for Main CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/wait-for-ci
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

  deploy:
    name: Deploy
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      production_url: ${{ steps.alias.outputs.production_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      # After a rollback Vercel stops auto-assigning production domains to new
      # deployments, so promote explicitly to make this deployment live.
      # A 409 "already the current production deployment" means it went live
      # on its own (no prior rollback) — that's success, not failure.
      - name: Promote to production
        run: |
          set +e
          OUT=$(vercel promote "${{ steps.deploy.outputs.url }}" --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ] && ! echo "$OUT" | grep -q "already the current production deployment"; then
            exit $CODE
          fi

      # Smoke-test the public production domain, not the unique *.vercel.app
      # deployment URL: that one sits behind Vercel Deployment Protection and
      # serves a login page (HTTP 200, no app) to anonymous clients. Branch
      # domains (gitBranch set, e.g. staging.*) are protected too, so only
      # production domains — no gitBranch, no redirect — qualify.
      - name: Resolve production domain
        id: alias
        run: |
          DOMAIN=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/domains" \
            | jq -r '[.domains[] | select(.redirect == null and .gitBranch == null) | .name] | (map(select(endswith(".vercel.app") | not)) + .)[0] // empty')
          if [ -z "$DOMAIN" ]; then echo "Could not resolve a production domain" >&2; exit 1; fi
          echo "production_url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Production domain: https://$DOMAIN"

  smoke:
    name: Smoke Test (deployment)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers come preinstalled in the official image (no `playwright install`,
    # which hung on hosted runners). Keep the tag in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    outputs:
      inconclusive: ${{ steps.preflight.outputs.inconclusive }}
    steps:
      # If the domain doesn't serve the app to anonymous clients (e.g. it's
      # behind a login wall), the smoke result says nothing about the
      # deployment: fail loudly, but don't roll back.
      - name: Preflight — domain serves the app publicly
        id: preflight
        env:
          BASE_URL: ${{ needs.deploy.outputs.production_url }}
        run: |
          FINAL=$(node -e "fetch(process.env.BASE_URL + '/', { redirect: 'follow' }).then(r => console.log(r.url)).catch(e => { console.error(e); process.exit(2); })")
          echo "Final URL: $FINAL"
          if [ "$(node -e "console.log(new URL('$FINAL').host)")" != "$(node -e "console.log(new URL(process.env.BASE_URL).host)")" ]; then
            echo "inconclusive=true" >> "$GITHUB_OUTPUT"
            echo "::error::$BASE_URL redirects to $FINAL (not publicly reachable); smoke test is inconclusive, not rolling back."
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Run smoke tests against the new deployment
        run: npx playwright test --project=chromium --grep @smoke
        env:
          CI: true
          HOME: /root
          BASE_URL: ${{ needs.deploy.outputs.production_url }}
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 30

  rollback:
    name: Rollback on smoke failure
    needs: [deploy, smoke]
    # Only when the smoke tests themselves failed against a reachable app
    # (not when cancelled/skipped or the preflight was inconclusive).
    if: failure() && needs.smoke.result == 'failure' && needs.smoke.outputs.inconclusive != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      # Without an id, Vercel rolls back to the previous production
      # deployment — the only rollback the Hobby plan allows (an explicit
      # older id fails with 402).
      - name: Roll back to the previous production deployment
        run: |
          echo "Smoke tests failed! Rolling back to the previous production deployment..."
          vercel rollback --yes --token=${{ secrets.VERCEL_TOKEN }}
