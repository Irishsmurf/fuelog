name: Vercel Production Deployment & Smoke Tests

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      previous_id: ${{ steps.pre_deploy.outputs.previous_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Capture Previous Deployment ID
        id: pre_deploy
        run: |
          PREV=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&target=production&limit=1" | jq -r '.deployments[0].uid')
          echo "previous_id=$PREV" >> "$GITHUB_OUTPUT"
          echo "Found previous deployment: $PREV"

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

  smoke:
    name: Smoke Test (deployment)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers come preinstalled in the official image (no `playwright install`,
    # which hung on hosted runners). Keep the tag in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Run smoke tests against the new deployment
        run: npx playwright test --project=chromium --grep @smoke
        env:
          CI: true
          HOME: /root
          BASE_URL: ${{ needs.deploy.outputs.url }}
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 30

  rollback:
    name: Rollback on smoke failure
    needs: [deploy, smoke]
    # Only when the smoke tests themselves failed (not when cancelled/skipped).
    if: failure() && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Roll back to the previous production deployment
        env:
          PREV: ${{ needs.deploy.outputs.previous_id }}
        run: |
          if [ "$PREV" != "null" ] && [ -n "$PREV" ]; then
            echo "Smoke tests failed! Rolling back to $PREV..."
            vercel rollback "$PREV" --yes --token=${{ secrets.VERCEL_TOKEN }}
          else
            echo "Could not determine previous deployment ID for rollback."
            exit 1
          fi
