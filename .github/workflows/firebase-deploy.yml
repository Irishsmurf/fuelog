name: Firebase Deploy

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'functions/**'
      - 'packages/core/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy half-way through; queue the next one instead.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy rules, indexes, Storage rules and Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only deploy from main (push or manual run) — never on PRs
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Test Cloud Functions before deploying
        run: npm test
        working-directory: functions

      # Non-interactive deploys need every functions param in a dotenv file
      # (the CLI won't fall back to defaults in CI). The dev-notification
      # allowlist comes from the DEV_NOTIFICATION_UIDS repo variable when set;
      # otherwise 'none' matches no uid (fails closed).
      - name: Write functions params
        run: echo "DEV_NOTIFICATION_UIDS=${{ vars.DEV_NOTIFICATION_UIDS || 'none' }}" > functions/.env

      # The functions predeploy hook (firebase.json) builds functions/lib.
      # Without --force, a deploy that would delete a function that exists in
      # the project but not in source fails loudly instead of deleting it.
      - name: Deploy
        run: firebase deploy --only firestore,storage,functions --project "${{ secrets.FIREBASE_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
