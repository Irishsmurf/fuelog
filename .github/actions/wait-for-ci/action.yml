name: Wait for Main CI
description: >
  Block until the Main CI run for this commit finishes, and fail unless it
  succeeded. Deploy workflows start on the same push as CI, so without this a
  red build (unit, rules, smoke or emulator E2E) would still ship.
inputs:
  sha:
    description: Commit whose Main CI run must pass.
    required: true
  token:
    description: Token with actions:read on this repository.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        RUN_ID=""
        # The CI run is created by the same push; give it a few minutes to appear.
        for _ in $(seq 1 30); do
          RUN_ID=$(gh run list -R "$REPO" --workflow main-ci.yml --commit "$SHA" \
            --json databaseId,event -q '[.[] | select(.event == "push")][0].databaseId // empty')
          [ -n "$RUN_ID" ] && break
          sleep 10
        done
        if [ -z "$RUN_ID" ]; then
          echo "::error::No Main CI run found for $SHA; refusing to deploy."
          exit 1
        fi
        echo "Waiting for Main CI run $RUN_ID (https://github.com/$REPO/actions/runs/$RUN_ID)"
        # --exit-status fails this step unless the run concludes successfully
        # (a failed, cancelled or superseded CI run blocks the deploy).
        gh run watch "$RUN_ID" -R "$REPO" --exit-status --interval 20 > /dev/null
        echo "Main CI passed for $SHA."
