name: Main CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type Check
        # -b follows the project references (app, node and api); a bare
        # `tsc --noEmit` checks nothing because the root tsconfig has files: [].
        run: npx tsc -b

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results/junit.xml
          report_type: test_results

  rules:
    name: Security Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run Firestore rules tests against the emulator
        run: npm run test:rules

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=critical

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate environment variables
        # Deploy-time check; secrets aren't available to Dependabot/fork PRs.
        if: github.event_name == 'push'
        run: npm run validate-env
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Build
        run: npm run build

  smoke:
    name: Smoke Test (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The official image ships the browsers for this exact Playwright version,
    # so there is no `playwright install` step (it hung for 6h on a runner, and
    # can't install deps on ubuntu-latest 26.04). Keep the tag in sync with
    # @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Build with placeholder config
        run: npm run build
        env:
          # Demo-project config so the bundle boots; this build is never deployed.
          VITE_FIREBASE_API_KEY: AIzaSyA-smoke-test-dummy-key-0000000000
          VITE_FIREBASE_AUTH_DOMAIN: demo-fuelog.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-fuelog
          VITE_FIREBASE_STORAGE_BUCKET: demo-fuelog.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      - name: Smoke test
        run: npx playwright test --project=chromium --grep @smoke
        env:
          CI: true
          HOME: /root

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (type check)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=critical
