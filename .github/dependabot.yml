version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Playwright is pinned to match the mcr.microsoft.com/playwright image
      # used by CI; bump both together by hand.
      - dependency-name: "@playwright/test"
      # typescript-eslint supports TypeScript <6.1 only; revisit when it widens.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      firebase:
        patterns:
          - "firebase*"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest*"
          - "playwright*"
      tailwind:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "postcss*"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps-functions)"
    ignore:
      # Types must match the Cloud Functions runtime (nodejs22 in firebase.json).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript moves together with the root project (<6.1 for typescript-eslint).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      firebase:
        patterns:
          - "firebase*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
